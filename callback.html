<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Signing in... | ElevateHR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="loading-container">
        <div class="spinner"></div>
        <h2 style="color: var(--dark-blue);">Completing sign in...</h2>
        <p style="color: var(--text-muted);">Establishing secure session with Google</p>
    </div>

    <script>
        /**
         * /auth/callback  — OAuth callback handler
         *
         * In a real app you would:
         *   1. Read the `?code=` query param from the URL
         *   2. Exchange it for tokens via your backend
         *   3. Save the session and redirect
         *
         * Here we mock a 1.5 s delay then auto-login a Google test user.
         */

        let mockUsers = JSON.parse(localStorage.getItem('hr_mock_users')) || [];

        function handleGoogleCallback() {
            const googleUser = {
                email:     'you@company.com',
                firstName: 'Google',
                lastName:  'User',
                username:  'google_user'
            };

            // Upsert mock user
            if (!mockUsers.find(u => u.email === googleUser.email)) {
                mockUsers.push({
                    email:     googleUser.email,
                    password:  'google_oauth',
                    firstName: googleUser.firstName,
                    lastName:  googleUser.lastName,
                    username:  googleUser.username
                });
                localStorage.setItem('hr_mock_users', JSON.stringify(mockUsers));
            }

            // Store session
            localStorage.setItem('hr_current_user', JSON.stringify({
                email:     googleUser.email,
                name:      `${googleUser.firstName} ${googleUser.lastName}`,
                firstName: googleUser.firstName,
                lastName:  googleUser.lastName
            }));

            // Redirect to app shell
            window.location.href = 'app.html';
        }

        // Simulate OAuth round-trip delay
        setTimeout(handleGoogleCallback, 1500);
    </script>

</body>
</html>
